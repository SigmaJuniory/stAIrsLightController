name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Job 1: Sprawdzenie formatowania kodu
  check-formatting:
    name: Check Code Formatting
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format-15
      
      - name: Check formatting
        run: |
          find src include lib test -name '*.cpp' -o -name '*.h' -o -name '*.hpp' 2>/dev/null | \
          xargs clang-format-15 --dry-run --Werror
      
      # Jeśli chcesz zobaczyć różnice gdy formatowanie jest złe:
      - name: Show formatting differences
        if: failure()
        run: |
          echo "Formatting errors found! Run locally:"
          echo "  clang-format -i <file>"
          echo ""
          echo "Differences:"
          find src include lib test -name '*.cpp' -o -name '*.h' -o -name '*.hpp' 2>/dev/null | \
          while read file; do
            diff -u "$file" <(clang-format-15 "$file") 2>/dev/null && echo "---"
          done

  # Job 2: Static Code Analysis (zamiast clang-format)
  static-analysis:
    name: Static Code Analysis
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio
      
      - name: Run static analysis
        run: pio check -e native --fail-on-defect=medium
        env:
          PLATFORMIO_FORCE_COLOR: true

  # Job 3: Testy native
  native-tests:
    name: Native Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install PlatformIO
        run: pip install platformio
      
      - name: Run native tests
        run: pio test -e native
        env:
          PLATFORMIO_FORCE_COLOR: true
  
  gdb-test:
    name: GDB Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build tests
        run: pio test -e native --without-testing

      - name: Install GDB
        run: |
          sudo apt-get update
          sudo apt-get install -y gdb

      - name: Run under GDB
        run: |
          gdb \
            --batch \
            -ex "run" \
            -ex "bt full" \
            -ex "thread apply all bt full" \
            .pio/build/native/program

  # Job 4: Check Status
  ci-status:
    name: CI Status
    runs-on: ubuntu-24.04
    needs:
      - check-formatting
      - static-analysis
      - native-tests
    if: always()
    steps:
      - name: Check job results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS_JSON" | jq -e 'del(.["memory-impact-target-branch"]) | all(.result == "success")'
