name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Job 1: Sprawdzenie formatowania kodu
  check-formatting:
    name: Check Code Formatting
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup LLVM 22
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg

          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22

      - name: Install clang-format
        run: sudo apt-get install -y clang-format-22

      - name: Run formatter check
        run: ./scripts/check-formatter.sh
      
      - name: Show clang-format diff (debug)
        if: failure()
        run: |
          echo "DIFF FROM clang-format:"
          find src include lib test -name '*.cpp' -o -name '*.h' -o -name '*.hpp' | \
          while read file; do
            echo "----- $file -----"
            clang-format "$file" | diff -u "$file" - || true
          done

  # Job 2: Static Code Analysis (zamiast clang-format)
  static-analysis:
    name: Static Code Analysis
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio
      
      - name: Run static analysis
        run: pio check -e release-esp32 --fail-on-defect=medium
        env:
          PLATFORMIO_FORCE_COLOR: true

  # Job 3: Testy native
  native-tests:
    name: Native Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install PlatformIO
        run: pip install platformio
      
      - name: Run native tests
        run: pio test -e test-native
        env:
          PLATFORMIO_FORCE_COLOR: true
  # Job 4: Check Status
  ci-status:
    name: CI Status
    runs-on: ubuntu-24.04
    needs:
      - check-formatting
      - static-analysis
      - native-tests
    if: always()
    steps:
      - name: Check job results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS_JSON" | jq -e 'del(.["memory-impact-target-branch"]) | all(.result == "success")'
