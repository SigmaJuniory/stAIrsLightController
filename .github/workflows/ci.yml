name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Job 1: Check formating with clang-format
  check-formatting:
    name: Check Code Formatting
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/sigmajuniory/stairs-light-ci:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run formatter check
        run: ./scripts/check-formatter.sh
      
      - name: Show clang-format diff (debug)
        if: failure()
        run: |
          echo "DIFF FROM clang-format:"
          find src include lib test -name '*.cpp' -o -name '*.h' -o -name '*.hpp' | \
          while read file; do
            echo "----- $file -----"
            clang-format "$file" | diff -u "$file" - || true
          done

  # Job 2: Static Code Analysis
  static-analysis:
    name: Static Code Analysis
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/sigmajuniory/stairs-light-ci:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
       
      - name: Run static analysis
        run: pio check -e release-esp32 --fail-on-defect=medium
        env:
          PLATFORMIO_FORCE_COLOR: true

  # Job 3: Release build and Native test
  native-tests:
    name: Verify Build and Native Tests
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/sigmajuniory/stairs-light-ci:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Verify release build
        run: pio test -e release-esp32 --without-uploading --without-testing
      
      - name: Run native tests
        run: pio test -e test-native
        env:
          PLATFORMIO_FORCE_COLOR: true
  # Job 4: Check Status
  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    needs:
      - check-formatting
      - static-analysis
      - native-tests
    if: always()
    steps:
      - name: Check job results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS_JSON" | jq -e 'del(.["memory-impact-target-branch"]) | all(.result == "success")'
