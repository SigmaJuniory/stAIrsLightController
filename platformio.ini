; ============================================================
; PLATFORMIO CONFIGURATION - StairLight Controller
; ============================================================

; ------------------------------------------------------------
; GLOBAL SETTINGS
; ------------------------------------------------------------
[platformio]
default_envs = test-native          ; Default environment when no -e specified
src_dir = src
test_dir = test

; ------------------------------------------------------------
; BASE TEMPLATES (not environments)
; ------------------------------------------------------------
[common]
test_framework = googletest
lib_deps = 
    bblanchon/ArduinoJson@^7.4.3
	google/googletest@^1.17.0
	adafruit/Adafruit BusIO@^1.17.4
	adafruit/Adafruit PWM Servo Driver Library @ ^3.0.3

; Base build flags for all
build_flags_base = 
    -Wall
    -Wextra
    ;-Wpedantic

lib_extra_dirs = lib/staticContainers

; ------------------------------------------------------------
[base:native]
extends = common
platform = native
build_type = debug
build_flags = 
    ${common.build_flags_base}
    -std=gnu++20
    -g  ; symbols for debugging
    -O0 ; no optimization

; ------------------------------------------------------------
[base:esp32]
extends = common
platform = espressif32
framework = arduino
board = esp32-s3-devkitc-1
;board = esp32s3box
monitor_speed = 115200

; Memory settings
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
board_build.extra_flags = -DBOARD_HAS_PSRAM
;upload_protocol = esp-builtin
upload_protocol = esptool 
build_flags = 
    ${common.build_flags_base}
    -std=gnu++2a
    -fexceptions
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

build_unflags = 
    -std=gnu++11
    -std=gnu++17

;#############################################################
; ------------------------------------------------------------
; ACTUAL TEST ENVIRONMENTS
; ------------------------------------------------------------
[env:test-native]
extends = base:native
test_filter = test_native

[env:test-esp32]
extends = base:esp32
test_filter = test_hardware
build_type = debug

; ------------------------------------------------------------
; ACTUAL RUN ENVIRONMENTS
; ------------------------------------------------------------
[env:release-esp32]
extends = base:esp32
test_filter = test_hardware
build_type = release
build_flags = 
    ${base:esp32.build_flags}
    ; -0s       ; optimization for size
